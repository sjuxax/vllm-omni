# Alias stage config for checkpoints whose `config.json` reports `model_type: "Hunyuan"`.
# Keep this in sync with `hunyuan_image_3_moe.yaml`.

stage_args:
  - stage_id: 0
    stage_type: llm
    runtime:
      process: true
      devices: "0,1,2,3"
      max_batch_size: 1
      requires_multimodal_data: true
    engine_args:
      model_stage: AR
      model_arch: HunyuanImage3ForCausalMM
      worker_cls: vllm_omni.worker.gpu_ar_worker.GPUARWorker
      scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
      gpu_memory_utilization: 0.45
      enforce_eager: true
      trust_remote_code: true
      engine_output_type: text
      distributed_executor_backend: "mp"
      enable_prefix_caching: true
      max_num_batched_tokens: 16384
      tensor_parallel_size: 4
      pipeline_parallel_size: 1
    is_comprehension: true
    final_output: false
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 2048
      seed: 42
      detokenize: true
      repetition_penalty: 1.1

  - stage_id: 1
    stage_type: diffusion
    runtime:
      process: true
      devices: "4,5,6,7"
      max_batch_size: 1
      requires_multimodal_data: true
    engine_args:
      model_stage: dit
      model_arch: HunyuanImage3ForCausalMM
      enforce_eager: true
      trust_remote_code: true
      distributed_executor_backend: "mp"
      # Diffusion stages only honor distributed settings when they are nested
      # under `parallel_config`; top-level TP keys are ignored.
      parallel_config:
        tensor_parallel_size: 4
        pipeline_parallel_size: 1
        data_parallel_size: 1
        sequence_parallel_size: 1
        ulysses_degree: 1
        ring_degree: 1
        cfg_parallel_size: 1
        enable_expert_parallel: true
    engine_input_source: [0]
    custom_process_input_func: vllm_omni.model_executor.stage_input_processors.hunyuan_image3.ar2diffusion
    final_output: true
    final_output_type: image
    is_comprehension: false
    default_sampling_params:
      seed: 42

runtime:
  enabled: true
  defaults:
    window_size: -1
    max_inflight: 1

  connectors:
    shared_memory_connector:
      name: SharedMemoryConnector
      extra:
        shm_threshold_bytes: 65536

  edges:
    - from: 0
      to: 1
      window_size: -1
